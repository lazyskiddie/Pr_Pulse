# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: PRPulse
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PRPulse:
    type: application
    platform: iOS
    sources: [PRPulse, Shared]
    dependencies:
      - target: PRPulseWidget
    entitlements:
      path: PRPulse/PRPulse.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.prpulse]
    info:
      path: PRPulse/Info.plist
      properties:
        CFBundleDisplayName: PR Pulse
        UILaunchScreen: {}
        CFBundleURLTypes:
          - CFBundleURLName: com.example.prpulse
            CFBundleURLSchemes: [prpulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.prpulse
  PRPulseWidget:
    type: app-extension
    platform: iOS
    sources: [PRPulseWidget, Shared]
    entitlements:
      path: PRPulseWidget/PRPulseWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.example.prpulse]
    info:
      path: PRPulseWidget/Info.plist
      properties:
        CFBundleDisplayName: PR Pulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.prpulse.widget
  PRPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PRPulseTests]
    dependencies:
      - target: PRPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PRPulse:
    build:
      targets:
        PRPulse: all
    test:
      targets: [PRPulseTests]
